name: Paganini Keep Alive

on:
  schedule:
    # Se ejecuta cada 6 horas (a las 00:00, 06:00, 12:00 y 18:00 UTC) igual que en tus otros proyectos
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente en cualquier momento desde GitHub Actions

jobs:
  keep-alive:
    name: Ping Actividad Base de Datos
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Paganini API (Vercel + Supabase PostgreSQL)
        run: |
          echo "Iniciando ping a la API de Paganini para registrar actividad en Supabase..."
          HTTP_CODE=$(curl -s --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" https://paganini-five.vercel.app/api/data)
          echo "Código HTTP recibido: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Ping completado con éxito. Consulta a Supabase PostgreSQL ejecutada."
          else
            echo "⚠️ Advertencia: Código HTTP recibido: $HTTP_CODE"
            exit 1
          fi

      - name: Ping directo a Supabase REST (Opcional si se configuran Secrets)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Realizando ping REST directo a Supabase..."
          curl -s -f -o /dev/null -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || true
          echo "✅ Ping REST a Supabase ejecutado."
